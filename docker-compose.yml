---
services:
  kasm:
    build: .
    image: ghcr.io/solarpunkhomestead/solarpunk-workspace:update-oshw-tools
    ports:
      - "6902:6901"
    environment:
      VNC_PW: password
    shm_size: '512m'
    stdin_open: true # docker run -i
    tty: true        # docker run -t
    network_mode: bridge
    volumes:
      - type: bind
        source: ./kasm_user
        target: /home/kasm-user
    security_opt:
      - seccomp=unconfined
    # Uncomment following lines to bind to serial ports on host machine
    # devices:
    #   - "/dev/ttyACM0"
    #   - "/dev/ttyUSB0"
    # device_cgroup_rules:
    #   - "c 188:* rmw"
    # privileged: true
...
