---
# List of plays
-
  # Hosts: where our play will run and options it will run with
  hosts: localhost
  connection: local
  gather_facts: yes
  tags: always

  # Vars: variables that will apply to the play, on all targets 

  # Tasks: the list of tasks that will be executed within 
  #        the play, this section can also be used for 
  #        pre and post tasks
  tasks:
    # from https://superuser.com/questions/1395954/ansible-playbook-to-determine-os-release
  - name: System details
    debug: msg="{{ item }}"
    with_items: 
    - "{{ ansible_distribution }}"
    - "{{ ansible_distribution_version }}"
    - "{{ ansible_distribution_major_version }}"
  - name: Verify install_files is present
    debug: msg="install_files/_README = {{ lookup('file', '/home/kasm-default-profile/install_files/_README') }}"  
    # Detect if we are running on a WSL2 environment
  - name: Verify install_files is present
    debug: msg="install_files/_README = {{ lookup('file', '/home/kasm-default-profile/install_files/_README') }}"
    # Detect if we are running on a WSL2 environment
  - name: Set wsl2_environment fact default to false
    set_fact:
      wsl2_environment: false
  - name: Set wsl2_environment fact True
    set_fact:
      wsl2_environment: true
    when: ansible_kernel is search("microsoft-standard-WSL2")  
  # fix for .gnupg/ permissions when building custom images
  - name: Add fix for .gnupg/ permissions
    lineinfile:
      path: "/etc/bash.bashrc"
      line: "chmod 700 ~/.gnupg/"    
  - name: Add custom prompt to /etc/skel/.profile
    lineinfile:
      path: "/etc/skel/.profile"
      line: 'export PS1="\[\033[00;32m\][\w]\$\[\033[00m\] "'
  - name: Get disk usage
    shell: df -h
    register: disk_usage
  - name: Display disk usage
    debug:
      msg: "{{ disk_usage.stdout }}"

  # Handlers: the list of handlers that are executed as a notify 
  #           key from a task

  # Roles: list of roles to be imported into the play
  roles:
  - role: irixjp.role_example_hello

# Add additional plays here (remember the list entry -)
# Be sure to use the same hosts and connection entries above
# addtional plays

-
# add dev user to give vs code somewhere to install extensions
  hosts: localhost
  connection: local
  tags:
    - install_utilities
    - install_vscode
    - install_python_packages
    - install_openscad
    - install_oshw_tools
    - install_orcaslicer
    - install_doctools

  tasks:
  - name: Add dev user
    user:
      name: dev
      uid: 1002
  - name: Get disk usage
    shell: df -h
    register: disk_usage
  - name: Display disk usage
    debug:
      msg: "{{ disk_usage.stdout }}"

-
  # install keychain, git, and @capsulecorplab .vimrc and .gitconfig
  hosts: localhost
  connection: local
  gather_facts: yes
  tags:
    - install_utilities
    - install_python_packages
    - install_vscode
    - install_fprime
    - install_pharo
    - install_openscad
    - install_oshw_tools
    - install_orcaslicer
    - install_doctools

  vars:
    nix_version: "2.35.3"
    nixpkgs_branch: "nixos-26.05"
    nix_bin_dir: /nix/var/nix/profiles/default/bin
    nix_bin_path: "{{ nix_bin_dir }}/nix"
    nix_install_dir: /home/kasm-default-profile/install_files/
    nix_installer_dir: "{{ nix_install_dir }}/nix-{{ nix_version }}-x86_64-linux"
    git_version: "2.54.0"
    keychain_version: "2.9.8"
    keychain_version_expected: "{{ keychain_version }}."

  tasks:
  - name: Download nix tarball {{ nix_version }}
    shell: curl -L https://releases.nixos.org/nix/nix-{{ nix_version }}/nix-{{ nix_version }}-x86\_64-linux.tar.xz -o {{ nix_installer_dir }}.tar.xz
  - name: Extract nix tarball to {{ nix_install_dir }}
    shell:
      cmd: "tar -xvf {{ nix_installer_dir }}.tar.xz"
      chdir: "{{ nix_install_dir }}"
      executable: /bin/bash
    args:
      creates: "{{ nix_installer_dir }}/install"
  - name: Create nix build users group # workaround to shut up installer from complaining about no nixbld group 
    shell: groupadd nixbld
  - name: Add dev to nixbld group # workaround to shut up installer from complaining about no user in nixbld group
    shell: usermod -aG nixbld dev
  - name: Unset LD_LIBRARY_PATH system-wide
    shell: printf "\nunset LD_LIBRARY_PATH\n" >> /etc/profile && . /etc/profile
  - name: Install (single-user) nix using classic nix installer with --yes (run install script non-interactively)
    shell:
      cmd: ./install --no-daemon --yes
      chdir: "{{ nix_installer_dir }}"
      executable: /bin/bash
    environment:
      LD_LIBRARY_PATH: ""
  - name: Add {{ nix_bin_dir }} to PATH system-wide
    shell: printf "\nexport PATH="{{ nix_bin_dir }}:$PATH"\n" >> /etc/profile && . /etc/profile
  - name: Install git {{ git_version }} with nix
    shell: "{{ nix_bin_path }} profile install nixpkgs/{{ nixpkgs_branch }}#git --extra-experimental-features 'nix-command flakes'"
    environment:
      LD_LIBRARY_PATH: ""
  - name: Install Git Bash Completion
    shell: "{{ nix_bin_path }} profile install nixpkgs/{{ nixpkgs_branch }}#bash-completion --extra-experimental-features 'nix-command flakes'"
    environment:
      LD_LIBRARY_PATH: ""
  - name: Install Keychain
    shell: "{{ nix_bin_path }} profile install nixpkgs/{{ nixpkgs_branch }}#keychain --extra-experimental-features 'nix-command flakes'"
    environment:
      LD_LIBRARY_PATH: ""
  - name: install ping
    shell: "{{ nix_bin_path }} profile install nixpkgs#unixtools.ping --extra-experimental-features 'nix-command flakes'"
    environment:
      LD_LIBRARY_PATH: ""
  - name: Get keychain version
    shell:
      cmd: "{{ nix_bin_dir }}/keychain -V 2> >(grep -i keychain) 2> >(sed 's/[[:alpha:]|(|[:space:]]//g') | fgrep '*' | sed 's/[*~://]//g'"
      executable: /bin/bash
    register: installed_keychain_version
    environment:
      LD_LIBRARY_PATH: ""
  - name: Get git version
    shell: "{{ nix_bin_dir }}/git version | sed 's/[[:alpha:]|(|[:space:]]//g'"
    register: installed_git_version
    environment:
      LD_LIBRARY_PATH: ""
  - name: Display git and keychain versions
    debug:
      msg: "git = {{ installed_git_version.stdout }} | keychain = {{ installed_keychain_version.stdout }}"
  - name: Test git version
    fail:
      msg: "Git Version Error: Expected {{ git_version }} | Found {{ installed_git_version.stdout }}"
    when: installed_git_version.stdout != git_version
  - name: Test keychain version
    fail:
      msg: "Keychain Version Error: Expected {{ keychain_version_expected }} | Found {{ installed_keychain_version.stdout }}"
    when: installed_keychain_version.stdout != keychain_version_expected
  - name: Install @capsulecorplab .vimrc
    get_url:
      url: https://gist.githubusercontent.com/capsulecorplab/495058e7a57ed8adaed3c40c80d09739/raw/4a6e6f6ff92b96919be111c9cbb5a4a21ab472d2/.vimrc
      dest: /home/kasm-default-profile/
  - name: Install @capsulecorplab .gitconfig
    get_url:
      url: https://gist.githubusercontent.com/capsulecorplab/401ba2fe0857a328f2a626adbf078cc6/raw/b89a6234f0d620ff60bcfe37f95de197b8772377/.gitconfig
      dest: /home/kasm-default-profile/
  - name: Get disk usage
    shell: df -h
    register: disk_usage
  - name: Display disk usage
    debug:
      msg: "{{ disk_usage.stdout }}"

-
  # Install java
  hosts: localhost
  connection: local
  tags:
    - install_generator_plantuml
    - install_utilities
    - install_doctools

  vars:
    nixpkgs_branch: "nixos-26.05"
    nix_bin_dir: /nix/var/nix/profiles/default/bin
    nix_bin_path: "{{ nix_bin_dir }}/nix"
    jdk_version: 21.0.12.1

  tasks:
  - name: Install openjdk with nix
    shell: "{{ nix_bin_path }} profile install nixpkgs/{{ nixpkgs_branch }}#openjdk --extra-experimental-features 'nix-command flakes'"
    environment:
      LD_LIBRARY_PATH: ""
  - name: Get JDK Version
    shell:
      cmd: "{{ nix_bin_dir }}/java --version | grep -m 1 -i openjdk  | awk '{print $2}'"
      executable: /bin/bash
    register: installed_jdk_version
    environment:
      LD_LIBRARY_PATH: ""
  - name: Test java version
    fail:
      msg: "OpenJDK Version Error: Expected {{ jdk_version }} | Found {{ installed_jdk_version.stdout }}"
    when: installed_jdk_version.stdout != jdk_version
  - name: Display JDK version
    debug:
      msg: "JDK = {{ installed_jdk_version.stdout }}"

-
  # install gradle
  hosts: localhost
  connection: local
  gather_facts: yes
  tags:
    - install_utilities
    - install_doctools

  vars:
    nixpkgs_branch: "nixos-26.05"
    nix_bin_dir: /nix/var/nix/profiles/default/bin
    nix_bin_path: "{{ nix_bin_dir }}/nix"
    gradle_version: "8.7"

  tasks:
  - name: Install unzip with nix
    shell: "{{ nix_bin_path }} profile install nixpkgs/{{ nixpkgs_branch }}#unzip --extra-experimental-features 'nix-command flakes'"
    environment:
      LD_LIBRARY_PATH: ""
  - name: Join gradle v{{ gradle_version }} zip file from split files
    shell: cat /home/kasm-default-profile/install_files/gradle-{{ gradle_version }}-bin.zip.parta* > /home/kasm-default-profile/install_files/gradle-{{ gradle_version }}-bin.zip
  - name: Create gradle directory
    file:
      path: /opt/gradle
      state: directory
      mode: '0755'
  - name: Unzip gradle binary
    shell:
      cmd: "{{ nix_bin_dir }}/unzip gradle-{{ gradle_version }}-bin.zip -d /opt/gradle/"
      chdir: /home/kasm-default-profile/install_files/
      executable: /bin/bash
    args:
      creates: /opt/gradle/gradle-{{ gradle_version }}/LICENSE
    environment:
      LD_LIBRARY_PATH: ""
  - name: "Create symlink to gradle in {{ nix_bin_dir }}"
    file:
      src: /opt/gradle/gradle-{{ gradle_version }}/bin/gradle
      dest: /usr/local/bin/gradle
      owner: root
      group: root
      state: link
  - name: Get gradle version
    shell:
      cmd: gradle --version | grep -v Welcome | grep Gradle | awk '{ print $2 }'
      executable: /bin/bash
    register: installed_gradle_version
    environment:
      LD_LIBRARY_PATH: ""
      PATH: "{{ nix_bin_dir }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  - name: Display gradle versions
    debug:
      msg: "gradle = {{ installed_gradle_version.stdout }}"
  - name: Test gradle version
    fail:
      msg: "Gradle Version Error: Expected {{ gradle_version }} | Found {{ installed_gradle_version.stdout }}"
    when: installed_gradle_version.stdout != gradle_version
-
  # install sudo for the vs-code role below
  hosts: localhost
  connection: local
  tags:
    - install_vscode
    - install_doctools

  vars:
    nixpkgs_branch: "nixos-26.05"
    nix_bin_dir: /nix/var/nix/profiles/default/bin
    nix_bin_path: "{{ nix_bin_dir }}/nix"

  tasks:
  - name: Install sudo
    shell: "{{ nix_bin_path }} profile install nixpkgs/{{ nixpkgs_branch }}#sudo --extra-experimental-features 'nix-command flakes'"
    environment:
      LD_LIBRARY_PATH: ""
  - name: Preserve DONT_PROMPT_WSL_INSTALL in sudoers
    lineinfile:
      path: "/etc/sudoers"
      line: "Defaults        env_keep += \"DONT_PROMPT_WSL_INSTALL\""
    when: wsl2_environment
  - name: Get disk usage
    shell: df -h
    register: disk_usage
  - name: Display disk usage
    debug:
      msg: "{{ disk_usage.stdout }}"

-
  # install VS Code
  hosts: localhost
  connection: local
  tags:
    - install_vscode
    - install_doctools

  environment:
    DONT_PROMPT_WSL_INSTALL: 1

  tasks:
  - name: Get disk usage
    shell: df -h
    register: disk_usage
  - name: Display disk usage
    debug:
      msg: "{{ disk_usage.stdout }}"

  roles:
    - role: gantsign.visual-studio-code
      visual_studio_code_version: "1.91.1*"
      users:
        - username: "dev"
          visual_studio_code_extensions:
            - ms-python.python
            - dendron.dendron
            #- foam.foam-vscode
          visual_studio_code_settings_overwrite: yes
          visual_studio_code_settings: {
            "extensions.ignoreRecommendations": true,
            "update.mode": "none",
            "extensions.autoUpdate": false,
            "extensions.autoCheckUpdates": false,
            "terminal.integrated.profiles.linux": {
              "bash (login)": {
                "path": "bash",
                "args": ["-l"]
                }
              },
            "terminal.integrated.defaultProfile.linux": "bash (login)"
          }

-
  # Copy VS Code changes to kasm-default-profile
  hosts: localhost
  connection: local
  tags:
    - install_vscode
    - install_doctools

  tasks:
  - name: Copy VS Code changes to kasm-default-profile
    shell:
      cmd: cp -r /home/dev/.config/Code/ /home/kasm-default-profile/.config/Code/ && cp -r /home/dev/.vscode/ /home/kasm-default-profile/.vscode/
  - name: Get disk usage
    shell: df -h
    register: disk_usage
  - name: Display disk usage
    debug:
      msg: "{{ disk_usage.stdout }}"

-
  # Install NodeJS Tools
  hosts: localhost
  connection: local
  gather_facts: yes
  tags:
  - install_node
  - install_doctools

  vars:
    node_version: "23.8.0"
    v_node_version: "v{{ node_version }}"
    npm_version: "10.9.2"
    npx_version: "10.9.2"
    yo_version: "5.0.0"
    generator_code_version: "1.11.1"
    oclif_version: "4.17.32"
    typescript_version: "5.5.3"
    m30pm_version: "0.2.1"
    markedpp_version: "2.0.1"
    markedpp_version_expected: "v{{ markedpp_version }}"

  tasks:   # Test Node JS Tools versions
  - name: Get node version
    shell: node --version
    register: installed_node_version
  - name: Get npm version
    shell: npm --version
    register: installed_npm_version
  - name: Get npx installed version
    shell: npx --version
    register: installed_npx_version
  - name: Get oclif version
    shell: oclif --version 2>/dev/null | sed 's/\ /\n/g' | grep oclif | sed 's/\///g' | sed 's/[[:alpha:]|(|[:space:]]//g'
    register: installed_oclif_version
  - name: Get TypeScript Compiler version
    shell: tsc --version | sed 's/[[:alpha:]|(|[:space:]]//g'
    register: installed_tsc_version
  - name: Get m30pm version
    shell: m30pm --version | awk '{ print $1 }' | sed 's/m30pm\///g'
    register: installed_m30pm_version
  - name: Get markedpp version | sed 's/v\///g'
    shell: markedpp --version
    register: installed_markedpp_version
  - name: Display node tool versions
    debug:
      msg: "Node = {{ installed_node_version.stdout }} | npm = {{ installed_npm_version.stdout }} | npx = {{ installed_npx_version.stdout }}"
  - name: Display TypeScript Compiler version
    debug:
      msg: "tsc = {{ installed_tsc_version.stdout }}"
  - name: Test node version
    fail:
      msg: "NodeJS Version Error: Expected {{ v_node_version }} | Found {{ installed_node_version.stdout }}"
    when: installed_node_version.stdout != v_node_version
  - name: Test npm version
    fail:
      msg: "NPM Version Error: Expected {{ npm_version }} | Found {{ installed_npm_version.stdout }}"
    when: installed_npm_version.stdout != npm_version
  - name: Test npx version
    fail:
      msg: "NPX Version Error: Expected {{ npx_version }} | Found {{ installed_npx_version.stdout }}"
    when: installed_npx_version.stdout != npx_version
  - name: Test oclif version
    fail:
      msg: "oclif Version Error: Expected {{ oclif_version }} | Found {{ installed_oclif_version.stdout }}"
    when: installed_oclif_version.stdout != oclif_version
  - name: Test TypeScript Compiler version
    fail:
      msg: "TypeScript Compiler Version Error: Expected {{ typescript_version }} | Found {{ installed_tsc_version.stdout }}"
    when: installed_tsc_version.stdout != typescript_version
  - name: Test m30pm version
    fail:
      msg: "m30pm Version Error: Expected {{ m30pm_version }} | Found {{ installed_m30pm_version.stdout }}"
    when: installed_m30pm_version.stdout != m30pm_version
  - name: Test markedpp version
    fail:
      msg: "markedpp Version Error: Expected {{ markedpp_version_expected }} | Found {{ installed_markedpp_version.stdout }}"
    when: installed_markedpp_version.stdout != markedpp_version_expected

  roles:
  - role: grzegorznowak.nvm_node
    nvm_install_script_version: "0.39.3"
    nvm_node_version: "{{ node_version }}"
    nvm_install_globally:
    - name: yo
      version: "{{ yo_version }}"
    - name: generator-code
      version: "{{ generator_code_version }}"
    - name: oclif
      version: "{{ oclif_version }}"
    - name: typescript
      version: "{{ typescript_version }}"
    - name: m30pm
      version: "{{ m30pm_version }}"
    - name: markedpp
      version: "{{ markedpp_version }}"

-
  # install Pandoc & TexLive
  hosts: localhost
  connection: local
  gather_facts: yes
  tags:
  - install_generator_pandoc
  - install_doctools

  vars:
    nixpkgs_branch: "nixos-26.05"
    nix_bin_dir: /nix/var/nix/profiles/default/bin
    nix_bin_path: "{{ nix_bin_dir }}/nix"
    yq_version: "4.33.2"
    yq_version_expected: "v{{ yq_version }}"
    pandoc_version: "3.2"
    texlive_version_expected: "pdfTeX 3.141592653-2.6-1.40.27 (TeX Live 2025/nixos.org)"

  tasks:
  - name: Install texliveFull
    shell: "{{ nix_bin_path }} profile install nixpkgs/{{ nixpkgs_branch }}#texliveFull --extra-experimental-features 'nix-command flakes'"
    environment:
      LD_LIBRARY_PATH: ""
  - name: Install yq
    copy:
      src: /home/kasm-default-profile/install_files/yq
      dest: /usr/bin/yq
      remote_src: yes
      owner: root
      group: root
      mode: '0755'
  - name: Get yq version
    shell: yq -V | awk '{ print $4 }'
    register: installed_yq_version
    environment:
      LD_LIBRARY_PATH: ""
  - name: Display yq version
    debug:
      msg: "yq = {{ installed_yq_version.stdout }}"
  - name: Test yq version
    fail:
      msg: "yq Version Error: Expected {{ yq_version_expected }} | Found {{ installed_yq_version.stdout }}"
    when: installed_yq_version.stdout != yq_version_expected
  - name: Get pandoc version
    shell: pandoc --version | grep -m 1 -i pandoc | sed 's/[[:alpha:]|(|[:space:]]//g'
    register: installed_pandoc_version
  - name: Get TeX Live version
    shell: "{{ nix_bin_dir }}/latex --version | grep -i Tex -m 1"
    register: installed_texlive_version
    environment:
      LD_LIBRARY_PATH: ""
  - name: Display pandoc and texlive versions
    debug:
      msg: "pandoc = {{ installed_pandoc_version.stdout }} | texlive = {{ installed_texlive_version.stdout }}"
  - name: Test pandoc version
    fail:
      msg: "Pandoc Version Error: Expected {{ pandoc_version }} | Found {{ installed_pandoc_version.stdout }}"
    when: installed_pandoc_version.stdout != pandoc_version
  - name: Test texlive version
    fail:
      msg: "TeX Live Version Error: Expected {{ texlive_version_expected }} | Found {{ installed_texlive_version.stdout }}"
    when: installed_texlive_version.stdout != texlive_version_expected

  roles:
  - role: andrewrothstein.pandoc
    pandoc_ver: "{{ pandoc_version }}"

-
  # install ASCII Doctor
  hosts: localhost
  connection: local
  gather_facts: yes
  tags:
  - install_generator_asciidoctor
  - install_doctools

  vars:
    nixpkgs_branch: "nixos-26.05"
    nix_bin_dir: /nix/var/nix/profiles/default/bin
    nix_bin_path: "{{ nix_bin_dir }}/nix"
    asciidoctor_version: 2.0.26
    public_suffix_version: 6.0.1

  tasks:
  - name: Install asciidoctor-with-extensions
    shell: "{{ nix_bin_path }} profile install nixpkgs/{{ nixpkgs_branch }}#asciidoctor-with-extensions --extra-experimental-features 'nix-command flakes'"
    environment:
      LD_LIBRARY_PATH: ""
  - name: Get asciidoctor version
    shell: "{{ nix_bin_dir }}/asciidoctor --version | grep Asciidoctor | awk '{ print $2 }'"
    register: installed_asciidoctor_version
    environment:
      LD_LIBRARY_PATH: ""
  - name: Display asciidoctor version
    debug:
      msg: "ASCII Doctor = {{ installed_asciidoctor_version.stdout }}"
  - name: Test asciidoctor version
    fail:
      msg: "ASCII Doctor Version Error: Expected {{ asciidoctor_version }} | Found {{ installed_asciidoctor_version.stdout }}"
    when: installed_asciidoctor_version.stdout != asciidoctor_version

-
  # install fprime tools
  hosts: localhost
  connection: local
  gather_facts: yes
  tags:
    - install_fprime

  vars:
    fprime_workspace_image_version: v3.4.0-1.1.0

  tasks:
  - name: Get ansible version (in ansible)
    shell:
      cmd: ansible --version
      executable: /bin/bash
    register: installed_ansible_version
  - name: Get ansible-playbook version (in ansible)
    shell:
      cmd: ansible-playbook --version
      executable: /bin/bash
    register: installed_ansible_playbook_version
  - name: Display ansible version
    debug:
      msg: ansible = {{ installed_ansible_version.stdout }}
  - name: Display ansible-playbook version
    debug:
      msg: ansible = {{ installed_ansible_playbook_version.stdout }}
  - name: Clone fprime-workspace-image
    shell:
      cmd: git clone https://github.com/fprime-community/fprime-workspace-image.git
      chdir: /home/kasm-default-profile/install_files
      executable: /bin/bash
  - name: Checkout {{ fprime_workspace_image_version }} in fprime-workspace-image repo
    shell:
      cmd: git checkout {{ fprime_workspace_image_version }}
      chdir: /home/kasm-default-profile/install_files/fprime-workspace-image
      executable: /bin/bash
  - name: Copy contents of fprime-workspace-image/install_files into install_files
    shell:
      cmd: cp -rf fprime-workspace-image/install_files/* .
      chdir: /home/kasm-default-profile/install_files
      executable: /bin/bash
  - name: Install fprime tools with ansible-galaxy
    shell:
      cmd: ansible-galaxy install -r requirements.yaml && ansible-playbook -i,localhost playbook.yaml --tags "install_fprime_tools" && rm -f ./*.yaml
      chdir: /home/kasm-default-profile/install_files/fprime-workspace-image
      executable: /bin/bash
  - name: Get disk usage
    shell: df -h
    register: disk_usage
  - name: Display disk usage
    debug:
      msg: "{{ disk_usage.stdout }}"

-
  # install OrcaSlicer
  hosts: localhost
  connection: local
  gather_facts: yes
  tags:
    - install_oshw_tools
    - install_orcaslicer

  vars:
    nixpkgs_branch: "nixos-26.05"
    nix_bin_dir: /nix/var/nix/profiles/default/bin
    nix_bin_path: "{{ nix_bin_dir }}/nix"
    orcaslicer_version: 2.3.2

  tasks:
  - name: Install orca-slicer  with nix
    shell: "{{ nix_bin_path }} profile install nixpkgs/{{ nixpkgs_branch }}#orca-slicer --extra-experimental-features 'nix-command flakes'"
    environment:
      LD_LIBRARY_PATH: ""
  - name: Get orca-slicer version
    shell: "{{ nix_bin_dir }}/orca-slicer --help | grep OrcaSlicer- | sed 's/OrcaSlicer-//g' | sed 's/://g'"
    register: installed_orcaslicer_version
    environment:
      LD_LIBRARY_PATH: ""
  - name: Display orca-slicer version
    debug:
      msg: "orca-slicer = {{ installed_orcaslicer_version.stdout }}"
  - name: Test orca-slicer version
    fail:
      msg: "orca-slicer Error: Expected {{ orcaslicer_version }} | Found {{ installed_orcaslicer_version.stdout }}"
    when: installed_orcaslicer_version.stdout != orcaslicer_version
  - name: Get disk usage
    shell: df -h
    register: disk_usage
  - name: Display disk usage
    debug:
      msg: "{{ disk_usage.stdout }}"

-
  # install OpenSCAD
  hosts: localhost
  connection: local
  gather_facts: yes
  tags:
    - install_oshw_tools
    - install_openscad

  vars:
    nixpkgs_branch: "nixos-26.05"
    nix_bin_dir: /nix/var/nix/profiles/default/bin
    nix_bin_path: "{{ nix_bin_dir }}/nix"
    openscad_version: "2021.01"
    openscad_version_to_install: "{{ openscad_version }}-6build4"

  tasks:
  - name: Install openscad  with nix
    shell: "{{ nix_bin_path }} profile install nixpkgs/{{ nixpkgs_branch }}#openscad --extra-experimental-features 'nix-command flakes'"
    environment:
      LD_LIBRARY_PATH: ""
  - name: Get OpenSCAD version
    shell: "{{ nix_bin_dir }}/openscad --info 2>/dev/null | grep 'OpenSCAD Version' | awk '{ print $3 '}"
    register: installed_openscad_version
    environment:
      LD_LIBRARY_PATH: ""
  - name: Display OpenSCAD version
    debug:
      msg: "OpenSCAD = {{ installed_openscad_version.stdout }}"
  - name: Test OpenSCAD version
    fail:
      msg: "OpenSCAD Version Error: Expected {{ openscad_version }} | Found {{ installed_openscad_version.stdout }}"
    when: installed_openscad_version.stdout != openscad_version
  - name: Get disk usage
    shell: df -h
    register: disk_usage
  - name: Display disk usage
    debug:
      msg: "{{ disk_usage.stdout }}"

-
  # install Python packages with pip
  hosts: localhost
  connection: local
  gather_facts: yes
  tags:
  - install_python_packages

  vars:
    nixpkgs_branch: "nixos-26.05"
    nix_bin_dir: /nix/var/nix/profiles/default/bin
    nix_bin_path: "{{ nix_bin_dir }}/nix"
    pint_version: 0.26.2

  tasks:
  - name: Install python3  with nix
    shell: "{{ nix_bin_path }} profile install nixpkgs/{{ nixpkgs_branch }}#python3 --extra-experimental-features 'nix-command flakes'"
    environment:
      LD_LIBRARY_PATH: ""
  - name: Install pip  with nix
    shell: "{{ nix_bin_path }} profile install nixpkgs/{{ nixpkgs_branch }}#python313Packages.pip --extra-experimental-features 'nix-command flakes'"
    environment:
      LD_LIBRARY_PATH: ""
  - name: Install python packages with pip
    pip:
      break_system_packages: true
      name:
        - pint=={{ pint_version }}
        # - jupyterlab==3.6.8
      extra_args: --ignore-installed
    environment:
      LD_LIBRARY_PATH: ""
      PATH: "{{ nix_bin_dir }}:$PATH"
  - name: Get Pint version
    shell: "{{ nix_bin_dir }}/python -c 'import pint; print(pint.__version__)'"
    register: installed_pint_version
    environment:
      LD_LIBRARY_PATH: ""
  - name: Display Pint versions
    debug:
      msg: "pint = {{ installed_pint_version.stdout }}"
  - name: Test Pint version
    fail:
      msg: "Pint Version Error: Expected {{ pint_version }} | Found {{ installed_pint_version.stdout }}"
    when: installed_pint_version.stdout != pint_version
  - name: Get disk usage
    shell: df -h
    register: disk_usage
  - name: Display disk usage
    debug:
      msg: "{{ disk_usage.stdout }}"

-
  # Install Pharo
  hosts: localhost
  connection: local
  tags:
    - install_pharo

  vars:
    pharo_launcher_version: "3.4.3"
    pharo_version: "12"
    roassal_version: "v1.01b"
    roassalexporter_version: "v1.0"
    neocsv_version: "fcffa0bba57b2c8c4624eb356fd29afc9b3dbf4a"
    xmlparser_version: "531f9b7c711c89e51ac54cb878099f5a89bca50e"

  tasks:
  - name: Clone PharoLauncher
    shell:
      cmd: git clone https://github.com/pharo-project/pharo-launcher.git
      chdir: /home/kasm-default-profile
      executable: /bin/bash
  - name: Checkout {{ pharo_launcher_version }} in pharo-launcher repo
    shell:
      cmd: git checkout {{ pharo_launcher_version }}
      chdir: /home/kasm-default-profile/pharo-launcher
      executable: /bin/bash
  - name: Download Pharo {{ pharo_version }} image + vm in pharo-launcher
    shell:
      cmd: curl https://get.pharo.org/{{ pharo_version }}0+vm | bash
      chdir: /home/kasm-default-profile/pharo-launcher
      executable: /bin/bash
  - name: Rename Pharo.image to PharoLauncher.image
    shell:
      cmd: mv Pharo.image PharoLauncher.image
      chdir: /home/kasm-default-profile/pharo-launcher
      executable: /bin/bash
  - name: Load PharoLauncher with Metachello from shell  # as per https://github.com/pharo-project/pharo-launcher/blob/feature/cmd-line/build.sh#L31C2-L31C183
    shell:
      cmd: ./pharo PharoLauncher.image eval --save "Metacello new baseline{{ ':' }} 'PharoLauncher'; repository{{ ':' }} 'gitlocal{{ ':' }}//src'; ignoreImage; onConflictUseIncoming; onWarning{{ ':' }} [{{ ':' }}ex | ex load]; load"
      chdir: /home/kasm-default-profile/pharo-launcher
      executable: /bin/bash
  - name: Enable PharoDarkTheme in PharoLauncher
    shell:
      cmd: ./pharo PharoLauncher.image eval --save "PharoDarkTheme beCurrent"
      chdir: /home/kasm-default-profile/pharo-launcher
      executable: /bin/bash
  - name: Configure pharo-launcher bash script
    shell: echo "#!/usr/bin/env bash\n/home/kasm-default-profile/pharo-launcher/pharo-ui /home/kasm-default-profile/pharo-launcher/PharoLauncher.image eval 'PharoLauncherApplication openFull'" > /home/kasm-default-profile/install_files/pharo-launcher
  - name: Copy pharo-launcher bash script into /home/kasm-default-profile/pharo-launcher and set to executable
    copy:
      src: /home/kasm-default-profile/install_files/pharo-launcher
      dest: /home/kasm-default-profile/pharo-launcher
      remote_src: yes
      owner: root
      group: root
      mode: a+x
  - name: Create symlink for pharo-launcher in /usr/local/bin
    shell: ln -sv /home/kasm-default-profile/pharo-launcher/pharo-launcher /usr/local/bin/pharo-launcher
  - name: Configure PharoLauncher desktop shortcut
    shell: echo "[Desktop Entry]\nName=Pharo\nGenericName=Pharo\nExec=pharo-launcher\nIcon=/home/kasm-default-profile/pharo-launcher/icons/pharo-launcher.png\nTerminal=false\nType=Application\nStartupNotify=false\nCategories=Application;Development;" > /usr/share/applications/pharo.desktop
  - name: Create RoassalPlayground (pharo image) using PharoLaucher-CLI
    shell:
      cmd: ./pharo PharoLauncher.image clap launcher image create RoassalPlayground --no-launch
      chdir: /home/kasm-default-profile/pharo-launcher
      executable: /bin/bash
  - name: Download Pharo {{ pharo_version }} image + vm into RoassalPlayground
    shell:
      cmd: curl https://get.pharo.org/{{ pharo_version }}0+vm | bash
      chdir: /home/kasm-default-profile/Pharo/images/RoassalPlayground
      executable: /bin/bash
  - name: Rename Pharo.changes to RoassalPlayground.changes
    shell:
      cmd: mv Pharo.changes RoassalPlayground.changes
      chdir: /home/kasm-default-profile/Pharo/images/RoassalPlayground
      executable: /bin/bash
  - name: Rename Pharo.image to RoassalPlayground.image
    shell:
      cmd: mv Pharo.image RoassalPlayground.image
      chdir: /home/kasm-default-profile/Pharo/images/RoassalPlayground
      executable: /bin/bash
  - name: Enable PharoDarkTheme in RoassalPlayground
    shell:
      cmd: ./pharo RoassalPlayground.image eval --save "PharoDarkTheme beCurrent"
      chdir: /home/kasm-default-profile/Pharo/images/RoassalPlayground
      executable: /bin/bash
  - name: Create directory for pharo-local/iceberg/ in /home/kasm-default-profile/Pharo/images/RoassalPlayground/
    shell:
      cmd: mkdir -p pharo-local/iceberg/
      chdir: /home/kasm-default-profile/Pharo/images/RoassalPlayground/
  - name: Create ObjectProfile/ directory for Roassal3 in RoassalPlayground/pharo-local/iceberg
    shell:
      cmd: mkdir ObjectProfile
      chdir: /home/kasm-default-profile/Pharo/images/RoassalPlayground/pharo-local/iceberg/
  - name: Clone Roassal3 into RoassalPlayground/pharo-local/iceberg/ObjectProfile/
    shell:
      cmd: git clone https://github.com/ObjectProfile/Roassal3.git
      chdir: /home/kasm-default-profile/Pharo/images/RoassalPlayground/pharo-local/iceberg/ObjectProfile
  - name: Checkout {{ roassal_version }} in Roassal3 repo
    shell:
      cmd: git checkout {{ roassal_version }}
      chdir: /home/kasm-default-profile/Pharo/images/RoassalPlayground/pharo-local/iceberg/ObjectProfile/Roassal3/
      executable: /bin/bash
  - name: Load Full Roassal3 package from local repo into RoassalPlayground using Metacello
    shell:
      cmd: ./pharo RoassalPlayground.image eval --save "[Metacello new baseline{{ ':' }} 'Roassal3'; repository{{ ':' }} 'gitlocal{{ ':' }}//./pharo-local/iceberg/ObjectProfile/Roassal3/src'; load{{ ':' }} 'Full'] on{{ ':' }} MCMergeOrLoadWarning do{{ ':' }} [:warning | warning load ]"
      chdir: /home/kasm-default-profile/Pharo/images/RoassalPlayground
      executable: /bin/bash
  - name: Create directory for svenvc/NeoCSV in RoassalPlayground/pharo-local/iceberg
    shell:
      cmd: mkdir svenvc
      chdir: /home/kasm-default-profile/Pharo/images/RoassalPlayground/pharo-local/iceberg/
  - name: Clone NeoCSV into RoassalPlayground/pharo-local/iceberg/svenvc
    shell:
      cmd: git clone https://github.com/svenvc/NeoCSV.git
      chdir: /home/kasm-default-profile/Pharo/images/RoassalPlayground/pharo-local/iceberg/svenvc
  - name: Checkout {{ neocsv_version }} in NeoCSV repo
    shell:
      cmd: git checkout {{ neocsv_version }}
      chdir: /home/kasm-default-profile/Pharo/images/RoassalPlayground/pharo-local/iceberg/svenvc/NeoCSV
      executable: /bin/bash
  - name: Load NeoCSV package from local repo into RoassalPlayground using Metacello
    shell:
      cmd: ./pharo RoassalPlayground.image eval --save "[Metacello new baseline{{ ':' }} 'NeoCSV'; repository{{ ':' }} 'gitlocal{{ ':' }}//./pharo-local/iceberg/svenvc/NeoCSV/repository'; load] on{{ ':' }} MCMergeOrLoadWarning do{{ ':' }} [:warning | warning load ]"
      chdir: /home/kasm-default-profile/Pharo/images/RoassalPlayground
      executable: /bin/bash
  - name: Clone XML-XMLParser into RoassalPlayground/pharo-local/iceberg/pharo-contributions
    shell:
      cmd: git clone https://github.com/pharo-contributions/XML-XMLParser.git
      chdir: /home/kasm-default-profile/Pharo/images/RoassalPlayground/pharo-local/iceberg/pharo-contributions
  - name: Checkout {{ xmlparser_version }} in NeoCSV repo
    shell:
      cmd: git checkout {{ xmlparser_version }}
      chdir: /home/kasm-default-profile/Pharo/images/RoassalPlayground/pharo-local/iceberg/pharo-contributions/XML-XMLParser
      executable: /bin/bash
  - name: Load XMLParser package from local repo into RoassalPlayground using Metacello
    shell:
      cmd: ./pharo RoassalPlayground.image eval --save "[Metacello new baseline{{ ':' }} 'XMLParser'; repository{{ ':' }} 'gitlocal{{ ':' }}//./pharo-local/iceberg/pharo-contributions/XML-XMLParser/src'; load] on{{ ':' }} MCMergeOrLoadWarning do{{ ':' }} [:warning | warning load ]"
      chdir: /home/kasm-default-profile/Pharo/images/RoassalPlayground
      executable: /bin/bash
  - name: Clone Roassal3Exporters into RoassalPlayground/pharo-local/iceberg/pharo-contributions
    shell:
      cmd: git clone https://github.com/ObjectProfile/Roassal3Exporters
      chdir: /home/kasm-default-profile/Pharo/images/RoassalPlayground/pharo-local/iceberg/pharo-contributions
  - name: Checkout {{ roassalexporter_version }} in Roassal3Exporters repo
    shell:
      cmd: git checkout {{ roassalexporter_version }}
      chdir: /home/kasm-default-profile/Pharo/images/RoassalPlayground/pharo-local/iceberg/pharo-contributions/Roassal3Exporters
      executable: /bin/bash
  - name: Load Roassal3Exporters package from local repo into RoassalPlayground using Metacello
    shell:
      cmd: ./pharo RoassalPlayground.image eval --save "[Metacello new baseline{{ ':' }} 'Roassal3Exporters'; repository{{ ':' }} 'gitlocal{{ ':' }}//./pharo-local/iceberg/pharo-contributions/Roassal3Exporters/src'; load] on{{ ':' }} MCMergeOrLoadWarning do{{ ':' }} [:warning | warning load ]"
      chdir: /home/kasm-default-profile/Pharo/images/RoassalPlayground
      executable: /bin/bash
  - name: Get disk usage
    shell: df -h
    register: disk_usage
  - name: Display disk usage
    debug:
      msg: "{{ disk_usage.stdout }}"

-
  # Clean up (remove) dev user now that things are installed
  hosts: localhost
  connection: local
  tags:
    - install_vscode
    - install_utilities
    - install_openscad
    - install_oshw_tools
    - install_orcaslicer
    - install_doctools

  tasks:
  - name: Remove dev user
    user:
      name: dev
      state: absent
      remove: yes
  - name: Get disk usage
    shell: df -h
    register: disk_usage
  - name: Display disk usage
    debug:
      msg: "{{ disk_usage.stdout }}"

